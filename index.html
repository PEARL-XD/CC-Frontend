<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Google Ads base tag. Purchase conversions are configured separately. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() { window.dataLayer.push(arguments); }
      gtag('consent', 'default', {
        ad_storage: 'denied',
        analytics_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied'
      });
      // Restore only an explicit, unexpired visitor choice before configuring the tag.
      (function () {
        var storageKey = 'cleanchops_ad_measurement_v1';
        var maxAge = 180 * 24 * 60 * 60 * 1000;
        function readStoredChoice() {
          try {
            var saved = JSON.parse(window.localStorage.getItem(storageKey));
            var age = Date.now() - saved.updatedAt;
            if (saved.version === 1 && typeof saved.allowed === 'boolean' &&
                Number.isSafeInteger(saved.updatedAt) && age >= 0 && age < maxAge) {
              return saved.allowed;
            }
          } catch { /* Unavailable storage must never imply consent. */ }
          return null;
        }
        var choice = readStoredChoice();
        function applyChoice() {
          gtag('consent', 'update', {
            ad_storage: choice === true ? 'granted' : 'denied',
            ad_user_data: choice === true ? 'granted' : 'denied',
            analytics_storage: 'denied',
            ad_personalization: 'denied'
          });
        }
        window.cleanChopsConsent = {
          storageKey: storageKey,
          read: function () { return choice; },
          choose: function (allowed) {
            if (typeof allowed !== 'boolean') return choice;
            choice = allowed;
            applyChoice();
            try {
              window.localStorage.setItem(storageKey, JSON.stringify({
                version: 1, allowed: allowed, updatedAt: Date.now()
              }));
            } catch { /* Keep the choice for this page when storage is blocked. */ }
            return choice;
          },
          restore: function () {
            choice = readStoredChoice();
            applyChoice();
            return choice;
          }
        };
        if (choice !== null) applyChoice();
      })();
      gtag('set', 'ads_data_redaction', true);
      gtag('js', new Date());
      gtag('config', 'AW-18474051740', {
        allow_ad_personalization_signals: false
      });
    </script>
    <script async src="https://www.googletagmanager.com/gtag/js?id=AW-18474051740"></script>
    <link rel="icon" type="image/svg+xml" href="/favico.png" />
     <!-- <link rel="icon" href="/favicon.ico" /> -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CleanChops</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
